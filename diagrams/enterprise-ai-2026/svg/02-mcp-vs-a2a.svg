<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1270" viewBox="0 0 1200 1270"><rect x="0" y="0" width="1200" height="1270" fill="#FFFFFF"/><text x="50" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#0B1F3A" text-anchor="start">MCP is vertical, A2A is horizontal</text><text x="50" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#475569" text-anchor="start">MCP connects an agent to tools and data. A2A connects agents to other agents.</text><text x="50" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#475569" text-anchor="start">You will usually need both.</text><text x="1170" y="1248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94A3B8" text-anchor="end">David Prat Robles  ·  linkedin.com/in/davidpratrobles</text><rect x="260" y="212" width="680" height="130" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="600.0" y="256.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="middle">Agent Card</text><text x="600.0" y="294.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">/.well-known/agent.json</text><text x="600.0" y="322.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">who I am, what I can do, how to authenticate</text><text x="600" y="422" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#2563EB" text-anchor="middle">A2A</text><text x="600" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#2563EB" text-anchor="middle">agent ↔ agent: tasks, streaming, long-running work</text><rect x="50" y="492" width="290" height="190" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="195.0" y="550.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="middle">Agent from</text><text x="195.0" y="582.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="middle">another team</text><text x="195.0" y="621.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">different framework,</text><text x="195.0" y="648.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">own release cycle</text><rect x="430" y="492" width="340" height="190" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="600.0" y="567.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0B1F3A" text-anchor="middle">Your agent</text><text x="600.0" y="611.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">built with LangGraph,</text><text x="600.0" y="638.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">ADK, Semantic Kernel...</text><rect x="860" y="492" width="290" height="190" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="1005.0" y="550.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="middle">Vendor / SaaS</text><text x="1005.0" y="582.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="middle">agent</text><text x="1005.0" y="621.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">e.g. ITSM, CRM or ERP</text><text x="1005.0" y="648.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">platform agents</text><defs><marker id="m53969100" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><line x1="344" y1="587.0" x2="426" y2="587.0" stroke="#2563EB" stroke-width="5" marker-end="url(#m53969100)" marker-start="url(#m53969100)"/><defs><marker id="m49368393" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><line x1="774" y1="587.0" x2="856" y2="587.0" stroke="#2563EB" stroke-width="5" marker-end="url(#m49368393)" marker-start="url(#m49368393)"/><rect x="50" y="922" width="204" height="130" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="152.0" y="980.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1F3A" text-anchor="middle">CRM</text><text x="152.0" y="1016.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="middle">MCP server</text><defs><marker id="m36499123" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><line x1="470" y1="685" x2="152.0" y2="919" stroke="#0F766E" stroke-width="3.5" marker-end="url(#m36499123)"/><rect x="274" y="922" width="204" height="130" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="376.0" y="980.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1F3A" text-anchor="middle">ERP / SAP</text><text x="376.0" y="1016.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="middle">MCP server</text><defs><marker id="m20012083" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><line x1="535" y1="685" x2="376.0" y2="919" stroke="#0F766E" stroke-width="3.5" marker-end="url(#m20012083)"/><rect x="498" y="922" width="204" height="130" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="600.0" y="965.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1F3A" text-anchor="middle">Document</text><text x="600.0" y="995.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1F3A" text-anchor="middle">store</text><text x="600.0" y="1031.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="middle">MCP server</text><defs><marker id="m50518782" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><line x1="600" y1="685" x2="600.0" y2="919" stroke="#0F766E" stroke-width="3.5" marker-end="url(#m50518782)"/><rect x="722" y="922" width="204" height="130" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="824.0" y="965.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1F3A" text-anchor="middle">Data</text><text x="824.0" y="995.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1F3A" text-anchor="middle">warehouse</text><text x="824.0" y="1031.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="middle">MCP server</text><defs><marker id="m91263756" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><line x1="665" y1="685" x2="824.0" y2="919" stroke="#0F766E" stroke-width="3.5" marker-end="url(#m91263756)"/><rect x="946" y="922" width="204" height="130" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="1048.0" y="965.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1F3A" text-anchor="middle">Internal</text><text x="1048.0" y="995.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1F3A" text-anchor="middle">REST APIs</text><text x="1048.0" y="1031.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="middle">MCP server</text><defs><marker id="m49777028" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><line x1="730" y1="685" x2="1048.0" y2="919" stroke="#0F766E" stroke-width="3.5" marker-end="url(#m49777028)"/><text x="1150" y="742" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#0F766E" text-anchor="end">MCP</text><text x="1150" y="778" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#0F766E" text-anchor="end">agent → tools &amp; data</text><rect x="50" y="1092" width="1100" height="107.2" rx="12" fill="#F1F5F9"/><text x="600" y="1142.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#0B1F3A" text-anchor="middle">Since August 2026 both protocols live under the Linux Foundation's Agentic AI</text><text x="600" y="1170.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#0B1F3A" text-anchor="middle">Foundation (AAIF): a neutral home, which matters for enterprise adoption.</text></svg>