<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2650" viewBox="0 0 1200 2650"><rect x="0" y="0" width="1200" height="2650" fill="#FFFFFF"/><text x="50" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#0B1F3A" text-anchor="start">A reference architecture for enterprise AI</text><text x="50" y="144" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#0B1F3A" text-anchor="start">in 2026</text><text x="50" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#475569" text-anchor="start">Five layers that repeat across sectors, plus the cross-cutting concerns that</text><text x="50" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#475569" text-anchor="start">decide if it reaches production</text><text x="1170" y="2628" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94A3B8" text-anchor="end">David Prat Robles  ·  linkedin.com/in/davidpratrobles</text><rect x="104.0" y="264" width="515.0" height="104" rx="14" fill="#DBEAFE"/><text x="361.5" y="309.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="middle">Web &amp; mobile apps</text><text x="361.5" y="347.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">customer-facing UX</text><rect x="635.0" y="264" width="515.0" height="104" rx="14" fill="#DBEAFE"/><text x="892.5" y="309.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="middle">Copilots in work tools</text><text x="892.5" y="347.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">Teams, Slack, IDE, CRM</text><rect x="104.0" y="384" width="515.0" height="104" rx="14" fill="#DBEAFE"/><text x="361.5" y="429.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="middle">APIs &amp; events</text><text x="361.5" y="467.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">partners, Kafka, webhooks</text><rect x="635.0" y="384" width="515.0" height="104" rx="14" fill="#DBEAFE"/><text x="892.5" y="429.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="middle">Back-office jobs</text><text x="892.5" y="467.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">batch, document intake</text><rect x="104" y="504" width="1046" height="90" rx="14" fill="#E0E7FF"/><text x="627.0" y="542" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1F3A" text-anchor="middle">API gateway + SSO / IAM</text><text x="627.0" y="574" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="middle">who is calling, and on whose behalf?</text><rect x="50" y="264" width="40" height="330" rx="10" fill="#1E3A8A"/><text x="70" y="429.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 70 429.0)" dominant-baseline="middle">CHANNELS</text><rect x="104" y="624" width="1046" height="170" rx="14" fill="#EDE9FE"/><text x="122" y="668.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="start">Agent runtime / orchestration</text><text x="122" y="704.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">LangGraph · Google ADK · Microsoft Agent Framework · OpenAI Agents SDK · Bedrock</text><text x="122" y="731.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">AgentCore</text><text x="122" y="763.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">Supervisor / router, tools, retries, human-in-the-loop</text><rect x="104" y="810" width="515.0" height="143" rx="14" fill="#EDE9FE"/><text x="122" y="854.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="start">State &amp; memory</text><text x="122" y="890.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">Checkpoints in Postgres / Redis</text><text x="122" y="921.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">Conversation + long-term memory</text><rect x="635.0" y="810" width="515.0" height="143" rx="14" fill="#EDE9FE"/><text x="653.0" y="854.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="start">Approvals &amp; workflow</text><text x="653.0" y="890.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">Human sign-off on risky actions</text><text x="653.0" y="921.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">Case / ticket systems</text><rect x="50" y="624" width="40" height="329" rx="10" fill="#1D4ED8"/><text x="70" y="788.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 70 788.5)" dominant-baseline="middle">AGENTS</text><rect x="104" y="983" width="1046" height="330" rx="14" fill="#2563EB"/><text x="128" y="1031" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">AI gateway</text><text x="128" y="1067" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#DBEAFE" text-anchor="start">one control plane for three kinds of traffic</text><rect x="128" y="1091" width="136.88" height="38" rx="19.0" fill="#FFFFFF"/><text x="196.44" y="1117" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#2563EB" text-anchor="middle">LLM calls</text><rect x="278.88" y="1091" width="198.48000000000002" height="38" rx="19.0" fill="#FFFFFF"/><text x="378.12" y="1117" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#2563EB" text-anchor="middle">MCP tool calls</text><rect x="491.36" y="1091" width="210.8" height="38" rx="19.0" fill="#FFFFFF"/><text x="596.76" y="1117" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#2563EB" text-anchor="middle">A2A agent calls</text><text x="128" y="1179.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start">Auth &amp; quotas · routing &amp; fallback · semantic cache</text><text x="128" y="1207.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start">PII / prompt-injection guardrails · cost per team · audit log</text><text x="128" y="1273" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#DBEAFE" text-anchor="start">LiteLLM · Azure APIM · Kong · Portkey · AgentCore Gateway</text><rect x="50" y="983" width="40" height="330" rx="10" fill="#2563EB"/><text x="70" y="1148.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 70 1148.0)" dominant-baseline="middle">GATEWAY</text><rect x="104" y="1343" width="1046" height="175" rx="14" fill="#CCFBF1"/><text x="122" y="1388.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#0B1F3A" text-anchor="start">Models</text><text x="122" y="1425.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">Frontier APIs: Azure OpenAI, Bedrock, Vertex AI</text><text x="122" y="1457.05" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">Open-weight &amp; SLMs self-hosted (vLLM on KServe)</text><text x="122" y="1488.35" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">Compressed SLMs at the edge / on device</text><rect x="104" y="1534" width="1046" height="175" rx="14" fill="#CCFBF1"/><text x="122" y="1579.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#0B1F3A" text-anchor="start">Context</text><text x="122" y="1616.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">RAG: pgvector, Azure AI Search, OpenSearch</text><text x="122" y="1648.05" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">MCP servers in front of CRM, ERP, documents, data products</text><text x="122" y="1679.35" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">Permissions travel with the user</text><rect x="104" y="1725" width="1046" height="144" rx="14" fill="#CCFBF1"/><text x="122" y="1770.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#0B1F3A" text-anchor="start">Other agents</text><text x="122" y="1807.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">Agents from other teams, vendors and SaaS (ServiceNow, Salesforce, SAP...)</text><text x="122" y="1839.05" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">Discovered via A2A Agent Cards</text><rect x="50" y="1343" width="40" height="526" rx="10" fill="#3B82F6"/><text x="70" y="1606.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 70 1606.0)" dominant-baseline="middle">CAPABILITIES</text><rect x="104" y="1899" width="515.0" height="197" rx="14" fill="#F1F5F9"/><text x="122" y="1943.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="start">Data platform</text><text x="122" y="1979.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">Lakehouse, ETL with AI steps</text><text x="122" y="2006.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">(extraction, classification), embedding</text><text x="122" y="2034.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">pipelines, data contracts</text><rect x="635.0" y="1899" width="515.0" height="197" rx="14" fill="#F1F5F9"/><text x="653.0" y="1943.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="start">LLMOps + DLOps</text><text x="653.0" y="1979.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">Prompts &amp; evals as code, tracing,</text><text x="653.0" y="2006.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">release gates</text><text x="653.0" y="2038.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">Fine-tune · distil · quantise · serve on</text><text x="653.0" y="2065.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">GPUs</text><rect x="50" y="1899" width="40" height="197" rx="10" fill="#60A5FA"/><text x="70" y="1997.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 70 1997.5)" dominant-baseline="middle">FOUNDATION</text><rect x="50" y="2136" width="1100" height="441.79999999999995" rx="16" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="78" y="2186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#B45309" text-anchor="start">Cross-cutting concerns</text><text x="78.0" y="2238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="start">Observability</text><text x="78.0" y="2270.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">OpenTelemetry GenAI spans, Langfuse /</text><text x="78.0" y="2297.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">LangSmith, cost &amp; latency</text><text x="614.0" y="2238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="start">Evaluation</text><text x="614.0" y="2270.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">golden sets, LLM-as-judge, red teaming,</text><text x="614.0" y="2297.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">online sampling</text><text x="78.0" y="2354.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="start">Guardrails</text><text x="78.0" y="2386.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">PII redaction, content safety,</text><text x="78.0" y="2413.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">prompt-injection checks</text><text x="614.0" y="2354.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="start">Identity &amp; security</text><text x="614.0" y="2386.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">agent identities, OAuth 2.1 for MCP, least</text><text x="614.0" y="2413.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">privilege</text><text x="78.0" y="2471.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="start">FinOps</text><text x="78.0" y="2503.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">tokens and GPU hours per team and per use</text><text x="78.0" y="2530.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">case</text><text x="614.0" y="2471.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="start">Governance</text><text x="614.0" y="2503.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">model inventory, risk tiers, EU AI Act</text><text x="614.0" y="2530.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">evidence</text></svg>