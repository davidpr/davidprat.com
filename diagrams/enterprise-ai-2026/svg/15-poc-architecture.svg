t-weight="700" fill="#0B1F3A" text-anchor="middle">Claims assistant API</text><text x="595.0" y="846.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">FastAPI + LangGraph: the same graph as production</text><text x="595.0" y="874.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">(supervisor, intake, coverage, fraud_check, human_review)</text><defs><marker id="m52099755" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><line x1="285" y1="906" x2="285" y2="982" stroke="#475569" stroke-width="4" marker-end="url(#m52099755)"/><circle cx="325" cy="944" r="19" fill="#BE123C"/><text x="325" y="951" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><defs><marker id="m27069294" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><line x1="905" y1="906" x2="905" y2="982" stroke="#475569" stroke-width="4" stroke-dasharray="7 5" marker-end="url(#m27069294)"/><text x="925" y="952" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#475569" text-anchor="start">traces</text><rect x="70" y="984" width="430" height="150" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="285.0" y="1038.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="middle">MCP server (mock core)</text><text x="285.0" y="1076.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">get_policy, create_claim_draft</text><text x="285.0" y="1104.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">over synthetic data</text><rect x="690" y="984" width="430" height="150" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="905.0" y="1038.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="middle">Langfuse</text><text x="905.0" y="1076.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">traces, prompt versions,</text><text x="905.0" y="1104.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">evaluation scores</text><defs><marker id="m73516742" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><line x1="560" y1="906" x2="560" y2="1252" stroke="#475569" stroke-width="4" marker-end="url(#m73516742)"/><circle cx="560" cy="1024" r="19" fill="#BE123C"/><text x="560" y="1031" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><defs><marker id="m56401486" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><line x1="640" y1="906" x2="640" y2="1252" stroke="#475569" stroke-width="4" marker-end="url(#m56401486)"/><circle cx="640" cy="1094" r="19" fill="#BE123C"/><text x="640" y="1101" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><rect x="40" y="1254" width="540" height="170" rx="14" fill="#E5E7EB" stroke="#111827" stroke-width="2"/><text x="310.0" y="1304.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="middle">AI gateway, light</text><text x="310.0" y="1343.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">non-production APIM or LiteLLM:</text><text x="310.0" y="1370.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">aliases mini and reasoning,</text><text x="310.0" y="1397.8999999999999" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">token limit, cost metrics</text><rect x="620" y="1254" width="500" height="170" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="870.0" y="1304.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="middle">PostgreSQL, one server</text><text x="870.0" y="1343.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">checkpoints, claim drafts,</text><text x="870.0" y="1370.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">synthetic policies,</text><text x="870.0" y="1397.8999999999999" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">pgvector for policy wordings</text><defs><marker id="m75709581" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><line x1="310" y1="1426" x2="310" y2="1502" stroke="#475569" stroke-width="4" marker-end="url(#m75709581)"/><rect x="40" y="1504" width="540" height="150" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="310.0" y="1558.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="middle">Azure OpenAI, one EU region</text><text x="310.0" y="1596.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">large, mini and embedding models,</text><text x="310.0" y="1624.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">default content filters</text><rect x="620" y="1504" width="500" height="150" rx="14" fill="#F1F5F9" stroke="#475569" stroke-width="2"/><text x="870.0" y="1558.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="middle">Blob Storage</text><text x="870.0" y="1596.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">photos and documents</text><text x="870.0" y="1624.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="middle">of the test claims</text><defs><marker id="p36343515" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><path d="M1122,829 L1142,829 L1142,1579 L1124,1579" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#p36343515)"/><rect x="40" y="1704" width="1120" height="360" rx="14" fill="#F1F5F9"/><text x="70" y="1746" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="start">The path of a demo</text><circle cx="88" cy="1783" r="19" fill="#BE123C"/><text x="88" y="1790" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="122" y="1790" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">A test user signs in with Entra ID and chats; photos go to Blob Storage.</text><circle cx="88" cy="1833" r="19" fill="#BE123C"/><text x="88" y="1840" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="122" y="1840" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">The same LangGraph graph as production runs in one container.</text><circle cx="88" cy="1883" r="19" fill="#BE123C"/><text x="88" y="1890" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="122" y="1890" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">Every model call goes through the light gateway, by alias.</text><circle cx="88" cy="1933" r="19" fill="#BE123C"/><text x="88" y="1940" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="122" y="1940" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">The agents call the same MCP tools, served by a mock of the core.</text><circle cx="88" cy="1983" r="19" fill="#BE123C"/><text x="88" y="1990" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="122" y="1990" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">Coverage answers come from pgvector; the graph state is checkpointed.</text><circle cx="88" cy="2033" r="19" fill="#BE123C"/><text x="88" y="2040" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="122" y="2040" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">A high-value claim pauses; a colleague approves it on the handler page.</text><rect x="40" y="2104" width="540" height="360" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="66" y="2148" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#15803D" text-anchor="start">Kept from day one</text><text x="66" y="2194" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">✓  Gateway URL with model aliases</text><text x="66" y="2234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">✓  MCP tool contract</text><text x="66" y="2274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">✓  Checkpoints and human approval</text><text x="66" y="2314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">✓  Traces and an evaluation set</text><text x="66" y="2354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">✓  Entra ID sign-in, EU region</text><rect x="620" y="2104" width="540" height="360" rx="14" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" stroke-dasharray="8 6"/><text x="646" y="2148" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#374151" text-anchor="start">Left for production</text><text x="646" y="2194" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">+  Front Door, WAF, second region</text><text x="646" y="2234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">+  Semantic cache, prompt shields</text><text x="646" y="2274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">+  Event Grid extraction job</text><text x="646" y="2314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">+  Service Bus and the real core APIs</text><text x="646" y="2354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">+  AI Search, private endpoints</text><text x="646" y="2394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">+  Mobile app, push notifications</text><text x="646" y="2434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">+  CI/CD evaluation gate</text></svg>