<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1697" viewBox="0 0 1200 1697"><rect x="0" y="0" width="1200" height="1697" fill="#FFFFFF"/><text x="50" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#0B1F3A" text-anchor="start">New projects vs. existing systems</text><text x="50" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#475569" text-anchor="start">Greenfield builds around agents; brownfield wraps what already works and adds</text><text x="50" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#475569" text-anchor="start">AI at the edges</text><text x="1170" y="1675" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94A3B8" text-anchor="end">David Prat Robles  ·  linkedin.com/in/davidpratrobles</text><rect x="50" y="212" width="1100" height="650" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="80" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#2563EB" text-anchor="start">Greenfield: agent-native</text><rect x="80" y="306" width="1040" height="76" rx="12" fill="#FFFFFF"/><text x="116" y="355.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#2563EB" text-anchor="middle">1</text><text x="160" y="352.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#0B1F3A" text-anchor="start">Start from the user journey and the decisions to automate</text><rect x="80" y="396" width="1040" height="76" rx="12" fill="#FFFFFF"/><text x="116" y="445.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#2563EB" text-anchor="middle">2</text><text x="160" y="442.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#0B1F3A" text-anchor="start">Agent runtime with explicit state (graph / workflow)</text><rect x="80" y="486" width="1040" height="76" rx="12" fill="#FFFFFF"/><text x="116" y="535.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#2563EB" text-anchor="middle">3</text><text x="160" y="532.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#0B1F3A" text-anchor="start">Every tool exposed through MCP from day one</text><rect x="80" y="576" width="1040" height="76" rx="12" fill="#FFFFFF"/><text x="116" y="625.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#2563EB" text-anchor="middle">4</text><text x="160" y="622.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#0B1F3A" text-anchor="start">All model, tool and agent calls through the AI gateway</text><rect x="80" y="666" width="1040" height="76" rx="12" fill="#FFFFFF"/><text x="116" y="715.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#2563EB" text-anchor="middle">5</text><text x="160" y="712.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#0B1F3A" text-anchor="start">Evals in CI: no prompt or model change ships without passing</text><rect x="80" y="756" width="1040" height="76" rx="12" fill="#FFFFFF"/><text x="116" y="805.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#2563EB" text-anchor="middle">6</text><text x="160" y="802.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#0B1F3A" text-anchor="start">Tracing on from the first prototype (OpenTelemetry GenAI)</text><rect x="50" y="902" width="1100" height="715.6" rx="18" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="80" y="964" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#B45309" text-anchor="start">Brownfield: AI on the existing estate</text><rect x="80" y="996" width="1040" height="76" rx="12" fill="#FFFFFF"/><text x="116" y="1045.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#B45309" text-anchor="middle">1</text><text x="160" y="1042.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#0B1F3A" text-anchor="start">Wrap existing REST / SOAP services as MCP tools (often at the gateway)</text><rect x="80" y="1086" width="1040" height="92.4" rx="12" fill="#FFFFFF"/><text x="116" y="1143.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#B45309" text-anchor="middle">2</text><text x="160" y="1125.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#0B1F3A" text-anchor="start">Add AI steps inside current ETL &amp; document flows (extract, classify,</text><text x="160" y="1156.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#0B1F3A" text-anchor="start">validate)</text><rect x="80" y="1192.4" width="1040" height="92.4" rx="12" fill="#FFFFFF"/><text x="116" y="1249.6000000000001" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#B45309" text-anchor="middle">3</text><text x="160" y="1231.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#0B1F3A" text-anchor="start">Event-driven sidecar: Kafka events trigger agents, results go back as</text><text x="160" y="1262.6000000000001" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#0B1F3A" text-anchor="start">events</text><rect x="80" y="1298.8000000000002" width="1040" height="76" rx="12" fill="#FFFFFF"/><text x="116" y="1347.8000000000002" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#B45309" text-anchor="middle">4</text><text x="160" y="1345.2000000000003" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#0B1F3A" text-anchor="start">Embed copilots in the tools people already use (CRM, ticketing, ERP)</text><rect x="80" y="1388.8000000000002" width="1040" height="92.4" rx="12" fill="#FFFFFF"/><text x="116" y="1446.0000000000002" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#B45309" text-anchor="middle">5</text><text x="160" y="1427.8000000000002" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#0B1F3A" text-anchor="start">Strangler pattern: replace manual steps one by one, keep the system of</text><text x="160" y="1459.0000000000002" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#0B1F3A" text-anchor="start">record</text><rect x="80" y="1495.2000000000003" width="1040" height="92.4" rx="12" fill="#FFFFFF"/><text x="116" y="1552.4000000000003" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#B45309" text-anchor="middle">6</text><text x="160" y="1534.2000000000003" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#0B1F3A" text-anchor="start">Reuse existing IAM, logging and data governance — do not build a</text><text x="160" y="1565.4000000000003" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#0B1F3A" text-anchor="start">parallel world</text></svg>