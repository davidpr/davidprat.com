<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1842" viewBox="0 0 1200 1842"><rect x="0" y="0" width="1200" height="1842" fill="#FFFFFF"/><text x="50" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#0B1F3A" text-anchor="start">DLOps: owning the deep-learning lifecycle</text><text x="50" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#475569" text-anchor="start">When you train, adapt, compress or self-host models, you need the ops of a</text><text x="50" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#475569" text-anchor="start">model builder, not only of an app builder</text><text x="1170" y="1820" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94A3B8" text-anchor="end">David Prat Robles  ·  linkedin.com/in/davidpratrobles</text><rect x="130" y="212" width="1020" height="96" rx="14" fill="#F1F5F9" stroke="#475569" stroke-width="2"/><text x="154" y="270.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0B1F3A" text-anchor="start">Data</text><text x="410" y="267.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">curation, synthetic data, licences, data contracts</text><defs><marker id="m84493780" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><line x1="270" y1="310" x2="270" y2="344" stroke="#475569" stroke-width="4" marker-end="url(#m84493780)"/><rect x="130" y="348" width="1020" height="96" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="154" y="406.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#6D28D9" text-anchor="start">Train / adapt</text><text x="410" y="389.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">LoRA / QLoRA, full fine-tuning, GPU scheduling (Kubernetes +</text><text x="410" y="418.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">Kueue, Slurm, Ray)</text><defs><marker id="m44053337" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker></defs><line x1="270" y1="446" x2="270" y2="480" stroke="#6D28D9" stroke-width="4" marker-end="url(#m44053337)"/><rect x="130" y="484" width="1020" height="96" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="154" y="542.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F766E" text-anchor="start">Compress</text><text x="410" y="525.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">distillation, quantisation, pruning — smaller, cheaper,</text><text x="410" y="554.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">edge-ready</text><defs><marker id="m93843584" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><line x1="270" y1="582" x2="270" y2="616" stroke="#0F766E" stroke-width="4" marker-end="url(#m93843584)"/><rect x="130" y="620" width="1020" height="96" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="154" y="678.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#B45309" text-anchor="start">Benchmark</text><text x="410" y="661.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">task &amp; safety evals vs. the base model, before any client</text><text x="410" y="690.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">sees it</text><defs><marker id="m20282493" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><line x1="270" y1="718" x2="270" y2="752" stroke="#B45309" stroke-width="4" marker-end="url(#m20282493)"/><rect x="130" y="756" width="1020" height="96" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="154" y="814.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#15803D" text-anchor="start">Registry</text><text x="410" y="797.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">versioned weights, model cards, lineage (MLflow, Hugging</text><text x="410" y="826.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">Face)</text><defs><marker id="m58552358" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><line x1="270" y1="854" x2="270" y2="888" stroke="#15803D" stroke-width="4" marker-end="url(#m58552358)"/><rect x="130" y="892" width="1020" height="96" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="154" y="950.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2563EB" text-anchor="start">Serve</text><text x="410" y="933.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">vLLM runtime · KServe control plane · llm-d cache-aware</text><text x="410" y="962.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">routing</text><defs><marker id="m39712574" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE123C"/></marker></defs><line x1="270" y1="990" x2="270" y2="1024" stroke="#BE123C" stroke-width="4" marker-end="url(#m39712574)"/><rect x="130" y="1028" width="1020" height="137.2" rx="14" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/><text x="154" y="1078" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#BE123C" text-anchor="start">Monitor in production</text><text x="154" y="1116.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">GPU utilisation · tokens/s · time-to-first-token · cost per 1k tokens ·</text><text x="154" y="1144.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0B1F3A" text-anchor="start">quality drift → feeds the next data cycle</text><defs><marker id="p62780884" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#BE123C"/></marker></defs><path d="M130,1096.6 L70,1096.6 L70,260.0 L126,260.0" fill="none" stroke="#BE123C" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#p62780884)"/><rect x="52" y="608.3" width="36" height="140" rx="6" fill="#FFFFFF"/><text x="70" y="678.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#BE123C" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 70 678.3)">feedback</text><text x="50" y="1255.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0B1F3A" text-anchor="start">Where DLOps sits in the ops family</text><rect x="50.0" y="1275.2" width="538.0" height="166.8" rx="14" fill="#F1F5F9" stroke="#475569" stroke-width="2"/><text x="68.0" y="1321.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0B1F3A" text-anchor="start">MLOps</text><text x="68.0" y="1354.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">classic ML: features, training, drift on</text><text x="68.0" y="1382.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">tabular / time series models</text><rect x="612.0" y="1275.2" width="538.0" height="166.8" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="630.0" y="1321.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2563EB" text-anchor="start">LLMOps</text><text x="630.0" y="1354.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">applications on foundation models:</text><text x="630.0" y="1382.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">prompts, RAG, agents, evals, tracing,</text><text x="630.0" y="1411.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">cost</text><rect x="50.0" y="1466.0" width="538.0" height="166.8" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="68.0" y="1512.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#6D28D9" text-anchor="start">DLOps</text><text x="68.0" y="1545.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">building &amp; running the models</text><text x="68.0" y="1573.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">themselves: GPUs, fine-tuning,</text><text x="68.0" y="1602.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">compression, serving</text><rect x="612.0" y="1466.0" width="538.0" height="166.8" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="630.0" y="1512.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#B45309" text-anchor="start">AgentOps</text><text x="630.0" y="1545.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">agents in production: tool permissions,</text><text x="630.0" y="1573.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">agent identity, A2A / MCP governance</text><rect x="50" y="1662.8000000000002" width="1100" height="99.80000000000001" rx="12" fill="#F1F5F9"/><text x="600" y="1702.8000000000002" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#0B1F3A" text-anchor="middle">Most companies need LLMOps from day one; DLOps only when they fine-tune,</text><text x="600" y="1732.7000000000003" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#0B1F3A" text-anchor="middle">compress or self-host — but then it is not optional.</text></svg>